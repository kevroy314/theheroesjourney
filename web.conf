# nginx config for the FitRogue static web build (inside the container).
#
# Caching model (see the [hash] step in run.sh):
#
#   index.html                          -> "no-cache": kept in the browser cache
#                                          but revalidated on every single load.
#                                          6 KB, and a 304 costs zero bytes.
#   index.<12 hex>.{wasm,pck,js,png,..} -> "immutable, max-age=1y": never even
#                                          revalidated.  Safe, because run.sh
#                                          derives the hash from the file's own
#                                          bytes, so different bytes == a
#                                          different URL.
#
# A rebuild therefore reaches the user like this: the browser revalidates
# index.html, gets a 200 with the new HTML, that HTML references new hashed
# URLs, and only the assets that actually changed are downloaded.  Nothing has
# to be manually cache-cleared, ever.
#
# run.sh also writes .gz/.br siblings next to the big assets; brotli_static /
# gzip_static serve them (with the *original* Content-Type, which is what
# WebAssembly.instantiateStreaming needs).
server {
    listen 8070;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The .wasm payload is tens of MB; let it stream without buffering to disk.
    sendfile on;
    tcp_nopush on;

    # Prefer the precompressed siblings run.sh generated.
    brotli_static on;
    gzip_static on;

    # On-the-fly compression only for the small text responses that have no
    # precompressed sibling (index.html).  Note application/wasm is absent on
    # purpose: we never want to burn CPU compressing 40 MB per request.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary off;   # set explicitly below; brotli_static does not set it

    etag on;

    # Godot's web export is a single-threaded (nothreads) build, so it does not
    # need cross-origin isolation headers.

    # Content-hashed assets: index.<hash>.wasm, index.<hash>.pck, index.<hash>.js,
    # index.<hash>.audio.worklet.js, index.<hash>.png, ...
    location ~ "^/index\.[0-9a-f]{12}\." {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }

    # Same-origin push API. Same origin matters: the service worker and the
    # OAuth cookie are both scoped to it, so this needs no CORS and no second
    # login.
    location /push/ {
        proxy_pass http://push:8071/push/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Android OTA releases.  `releases/` is bind-mounted at /srv/releases by
    # docker-compose and written only by tools/publish_release.py.
    #
    # `alias` rather than a directory under the html root: that root is itself a
    # read-only bind mount, so nothing can be mounted inside it.
    #
    # One block covers both files because `default_type` only applies when the
    # extension is absent from mime.types.  .json is present and keeps
    # application/json; .apk is not, so it lands on the package-archive type —
    # without which Chrome on Android will not hand the download to the package
    # installer.
    #
    # Never cached: rebuilding the same versionCode during development replaces
    # the APK under an unchanged name, and a pinned copy would strand the phone
    # on the old build.
    #
    # Reaching this from a phone at all is a proxy-level question — the OAuth
    # carve-out lives in ~/homie/nginx-proxy/nginx.conf.  See
    # docs/android-release-nginx.conf.
    location /releases/ {
        alias /srv/releases/;
        autoindex off;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-store" always;
    }

    # nginx's mime.types has no entry for .webmanifest, and a bare `types` block
    # here would replace the whole inherited map rather than extend it.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;
    }

    # The worker is fetched by fixed name and must never be pinned — a stale
    # service worker is the one cache you cannot clear from the server side.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;
    }

    # index.html and anything not content-hashed: cache, but always revalidate.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri $uri/ =404;
    }
}
