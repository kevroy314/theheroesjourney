# Android OTA release hosting for The Heroes' Journey — REFERENCE COPY.
# Nothing reads this file. It is the change to make by hand, recorded here so
# it lives in the repo next to the thing it serves.
#
# WHERE IT GOES
#   ~/homie/nginx-proxy/nginx.conf, inside the existing
#   `server_name fitrogue.home.kevinhorecka.com;` block (around line 1061),
#   placed ABOVE that block's `location / {`.
#
# WHY THERE AND NOT IN THIS REPO'S web.conf
#   web.conf runs inside the fitrogue container, which never sees oauth2-proxy:
#   the login is imposed by the *proxy's* `auth_request /oauth2/auth`, so only
#   the proxy can decline to impose it. A phone cannot complete a Google OAuth
#   redirect from a background download — the same problem macropad solved by
#   letting /api/* skip oauth2-proxy and authenticate with its own key — so the
#   carve-out has to be here. web.conf's only share of this is the .apk MIME
#   type, which it already declares.
#
# WHAT IT EXPOSES
#   Exactly two shapes of file, and only inside /releases/:
#     https://fitrogue.home.kevinhorecka.com:1403/releases/releases.json
#     https://fitrogue.home.kevinhorecka.com:1403/releases/HeroesJourney-<name>-<code>.apk
#   Both written by tools/publish_release.py. The rest of the site — the game,
#   /push/*, everything — keeps Google OAuth untouched.
#
# THE SECRET
#   Generate one and paste it in below; do NOT commit the real value, this file
#   is in git:
#     openssl rand -hex 32
#   The same string is baked into the Android app. Rotating it means editing
#   this block, reloading the proxy, and shipping an APK that knows the new one
#   — so rotate by *adding* the new key first (a second `if`), publishing a
#   build, then removing the old one.
#
# APPLY
#   cd ~/homie/nginx-proxy
#   docker compose exec nginx nginx -t
#   docker compose up -d --force-recreate      # nginx.conf is bind-mounted

    # --- Android OTA releases: shared-secret auth, no OAuth ---
    # A regex location, so it is matched ahead of the prefix `location /` that
    # guards the game with auth_request. The pattern is the entire allowlist:
    # the index and APKs by name. No directory listing, no .aab, no traversal,
    # and nothing else under /releases/ becomes reachable by accident.
    location ~ "^/releases/(releases\.json|[A-Za-z0-9][A-Za-z0-9._-]*\.apk)$" {
        # The key arrives as a header from the in-app updater, or as ?key= from
        # a browser. The query form is not laziness: the *first* install has to
        # be typed into the phone's browser, before there is an app to send a
        # header. Same reasoning as macropad's /api/release/download.
        set $release_key $arg_key;
        if ($http_x_release_key) { set $release_key $http_x_release_key; }
        # `if` inside a location is only dangerous when other modules' directives
        # sit inside it; `set` and `return` are the two documented-safe uses.
        if ($release_key != "PASTE_THE_SHARED_SECRET_HERE") { return 403; }

        proxy_pass http://host.docker.internal:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 60 MB over a phone's wifi: stream it rather than spooling it to the
        # proxy's disk first, and give a slow connection room to finish.
        proxy_buffering off;
        proxy_read_timeout 600;
    }
