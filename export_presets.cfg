[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/**/*.json"
exclude_filter="art/*"
export_path="build/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"theme-color\" content=\"#12131C\">
<meta name=\"apple-mobile-web-app-title\" content=\"Heroes'\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">
<link rel=\"manifest\" href=\"manifest.webmanifest\">
<script src=\"pwa.js\" defer></script>
<style>
/* The stock shell leaves the canvas unsized in CSS, so the adaptive resize
   policy grows the document and the viewport runs away. Pin it to the window. */
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #12131C; }
#canvas { display: block; width: 100vw !important; height: 100vh !important; height: 100dvh !important; touch-action: none; }
</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
html/generate_pwa=false
html/pwa/enabled=false
html/pwa/offline_page=""
progressive_web_app/enabled=false

