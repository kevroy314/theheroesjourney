name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7

jobs:
  selftest:
    name: headless self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The editor build, not the export template: the self-test runs the
      # project from source with --headless, which needs the full binary.
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-stable-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$URL"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Self-test
        run: GODOT=~/godot/godot ./test.sh

  data:
    name: data files parse and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every JSON file under data/
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = []
          files = sorted(glob.glob("data/**/*.json", recursive=True)) + ["web/manifest.webmanifest"]
          for path in files:
              try:
                  with open(path, encoding="utf-8") as f:
                      json.load(f)
              except Exception as exc:
                  bad.append("%s: %s" % (path, exc))
          print("checked %d files" % len(files))
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          PY

      # Parsing only proves the braces match. This checks the content against
      # data/schema.json: required and unknown keys, every reference resolving,
      # and the modifier vocabulary -- including whether any Rules.value() call
      # actually reads each key, which needs the GDScript source and so cannot
      # be done from inside the game. It needs no engine, so it fails a bad
      # content edit in seconds rather than after the self-test downloads Godot.
      #
      # Warnings are not fatal here: they are the findings whose fix lives
      # outside data/ (a verb no code implements, a prop on a biome the world
      # generator never produces). Add --strict to make them fail the build.
      - name: Validate data against data/schema.json
        run: python3 tools/validate_data.py
